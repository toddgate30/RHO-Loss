# Linux x86_64 / P100 only. Keep the original Python and research-library versions.
# Conda supplies a coherent Python base; pip installs hash-pinned CUDA 11.1 wheels.
# Avoid the historical export's mixed-channel OS/MKL/JPEG build constraints.
name: rho-loss-p100
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9.6
  - pip=21.2.4
  - pip:
      - -r requirements-p100.txt
